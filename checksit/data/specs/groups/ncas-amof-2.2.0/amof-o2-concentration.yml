var-requires0:
  func: checksit.generic.check_var
  params:
    variable:
      - mole_fraction_of_molecular_oxygen_in_air:__OPTIONAL__
    defined_attrs:
      - type:float
      - dimension:time
      - long_name:Mole Fraction of Molecular Oxygen in air
      - _FillValue:-1e+20
      - valid_min:<derived from file>
      - valid_max:<derived from file>
      - coordinates:latitude longitude
      - chemical_species:O2
    rules_attrs:
      - units: rule-func:match-one-of:1|1e-3|1e-6|1e-9|1e-12
      - practical_units: rule-func:match-one-of:mmol mol-1|micro mol mol-1|nmol mol-1|pmol mol-1
      - cell_methods: "rule-func:match-one-of:time: point|time: mean"
    additional_attrs_allowed:
      False
